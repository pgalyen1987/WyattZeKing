<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Common Head -->
    <div id="common-head"></div>

    <!-- jQuery -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#common-head').load('header.html');
        });
    </script>
</head>

<body>
    <!-- Navigation -->
    <div id="navigation"></div>
    <script>
        $(document).ready(function () {
            $('#navigation').load('navbar.html');
        });
    </script>

    <!-- Page Content -->
    <main>
        <!-- Hero -->
        <section class="hero">
            <div class="hero-content">
                <h1>Latest Videos</h1>
                <h2 class="subtitle">
                    New videos appear here automatically.
                    <a href="https://www.youtube.com/@stranger13-silent" target="_blank" style="color: #08f934;">
                        Subscribe on YouTube
                    </a>
                </h2>
             </div>
        </section>

        <!-- Video Gallery -->
        <section class="media-gallery" id="videoGallery">
            <!-- Videos injected here -->
        </section>

        <!-- More Videos -->
        <div class="more-games" style="text-align:center; margin: 60px 0;">
            <a
                href="https://www.youtube.com/@stranger13-silent"
                target="_blank"
                class="btn-primary"
            >
                View All Videos on YouTube
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-wrap">
        <p>&copy; 2025 Wyatt Ze King. All rights reserved.</p>
    </footer>

    <!-- YouTube Loader -->
    <script>
        const apiKey     = "AIzaSyBWHAY0u--3CU13q86FV_f5qOtKyGLdc-w";
        const channelId  = "UC6vqZtxFTCIlDXIZRWs4xIQ";
        const maxResults = 6;

        fetch(`https://www.googleapis.com/youtube/v3/search?key=${apiKey}&channelId=${channelId}&part=snippet,id&order=date&maxResults=${maxResults}`)
            .then(response => response.json())
            .then(data => {
                const gallery = document.getElementById("videoGallery");
                gallery.innerHTML = "";

                data.items.forEach(item => {
                    if (!item.id.videoId) return;

                    const card = document.createElement("article");
                    card.className = "media-card";

                    card.innerHTML = `
                        <h3>${item.snippet.title}</h3>
                        <iframe
                            src="https://www.youtube.com/embed/${item.id.videoId}"
                            title="${item.snippet.title}"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                            allowfullscreen
                            loading="lazy">
                        </iframe>
                    `;

                    gallery.appendChild(card);
                });
            })
            .catch(err => console.error("Error loading videos:", err));
    </script>
</body>
</html>
