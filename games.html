<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Games | Big Lizard Games</title>

    <!-- Common Head -->
    <div id="common-head"></div>

    <!-- Styles -->
    <link href="css/styles.css" rel="stylesheet" type="text/css" />

    <!-- jQuery -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#common-head').load('header.html');
        });
    </script>
</head>

<body>
    <!-- Navigation -->
    <header id="navigation"></header>
    <script>
        $(document).ready(function () {
            $('#navigation').load('navbar.html');
        });
    </script>

    <!-- Main Content -->
    <main class="page-content">
        <section class="panel mar-bottom">
            <div class="hero">
                <h1>All Games</h1>
            </div>

            <!-- Games Container -->
            <div class="games" id="games-container"></div>

            <!-- More Games Link -->
            <div class="more-games" style="text-align:center; margin: 50px 0;">
                <a
                    href="https://scratch.mit.edu/users/biglizard34444/projects/"
                    target="_blank"
                    class="btn-primary"
                >
                    See More Games on Scratch
                </a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer-wrap">
        <p>&copy; 2025 Big Lizard Games. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script>
        const games = [
            {
                title: "Sword Master 2 Demo",
                embed: "https://scratch.mit.edu/projects/1068025190/embed"
            },
            {
                title: "Saving Time for Me",
                embed: "https://scratch.mit.edu/projects/1217453599/embed"
            },
            {
                title: "Make A Soup",
                embed: "https://scratch.mit.edu/projects/1018008491/embed"
            },
            {
                title: "The Biglizard 2: The Dungen Demo",
                embed: "https://scratch.mit.edu/projects/1042991539/embed"
            }
        ];

        const container = document.getElementById("games-container");

        games.forEach(game => {
            const gameCard = document.createElement("article");
            gameCard.className = "game-card";

            gameCard.innerHTML = `
                <h3>${game.title}</h3>
                <iframe
                    src="${game.embed}"
                    allowtransparency="true"
                    frameborder="0"
                    scrolling="no"
                    allowfullscreen
                    loading="lazy">
                </iframe>
            `;

            container.appendChild(gameCard);
        });
    </script>
</body>
</html>
