<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Common Head -->
    <div id="common-head"></div>

    <!-- jQuery -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#common-head').load('header.html');
        });
    </script>
</head>

<body>
    <!-- Navigation -->
    <div id="navigation"></div>
    <script>
        $(document).ready(function () {
            $('#navigation').load('navbar.html');
        });
    </script>

    <!-- Page Content -->
    <main>
        <!-- Hero -->
        <section class="hero">
            <div class="hero-content">
                <h1>All Games</h1>
                <h2 class="subtitle">Original games created with imagination, persistence, and creativity.</h2>
            </div>
        </section>

        <!-- Games Gallery -->
        <section class="media-gallery" id="games-container"></section>

        <!-- More Games -->
        <div class="more-games" style="text-align:center; margin: 60px 0;">
            <a
                href="https://scratch.mit.edu/users/biglizard34444/projects/"
                target="_blank"
                class="btn-primary"
            >
                See More Games on Scratch
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-wrap">
        <p>&copy; 2025 Big Lizard Games. All rights reserved.</p>
    </footer>

    <!-- Game Loader -->
    <script>
        const games = [
            {
                title: "Mr Happy Mean Level Demo",
                embed: "https://scratch.mit.edu/projects/1071230498/embed"
            },
            {
                title: "Saving Time for Me",
                embed: "https://scratch.mit.edu/projects/1217453599/embed"
            },
            {
                title: "Make A Soup",
                embed: "https://scratch.mit.edu/projects/1018008491/embed"
            },
            {
                title: "The Biglizard 2: The Dungeon Demo",
                embed: "https://scratch.mit.edu/projects/1042991539/embed"
            }
        ];

        const container = document.getElementById("games-container");

        games.forEach(game => {
            const card = document.createElement("article");
            card.className = "media-card";

            card.innerHTML = `
                <h3>${game.title}</h3>
                <iframe
                    src="${game.embed}"
                    allow="fullscreen"
                    allowfullscreen
                    loading="lazy">
                </iframe>
            `;

            container.appendChild(card);
        });
    </script>
</body>
</html>
