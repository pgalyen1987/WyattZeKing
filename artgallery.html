<!DOCTYPE html>
<html lang="en">
<head>
    <div id="common-head"></div>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#common-head').load('header.html');
        });
    </script>
</head>

<body>
    <!-- Navigation -->
    <div id="navigation"></div>
    <script>
        $(document).ready(function () {
            $('#navigation').load('navbar.html');
        });
    </script>

    <!-- Page Hero -->
    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Art Gallery</h1>
                <h2 class="subtitle">Original Artwork & Character Designs</h2>
             </div>
        </section>

        <!-- Art Gallery -->
        <section class="media-gallery">

            <!-- Artwork Card -->
            <div class="media-card">
                <h3>Ban Ban OC</h3>
                <img
                    src="images/ban ban oc.png"
                    alt="Original character artwork named Ban Ban"
                    style="width:100%; height:auto;"
                />
            </div>

            <div class="media-card">
                <h3>What the Skibidi Toilet</h3>
                <img
                    src="images/skibidi_toilet2.gif"
                    alt="Original character artwork named Ban Ban"
                    style="width:100%; height:auto;"
                />
            </div>

            <div class="media-card">
                <h3>Bat</h3>
                <img
                    src="images/bat.png"
                    alt="Original character artwork named Ban Ban"
                    style="width:100%; height:auto;"
                />
            </div>

            <div class="media-card">
                <h3>Self Portrait</h3>
                <img
                    src="images/self_portrait.jpg"
                    alt="Original character artwork named Ban Ban"
                    style="width:100%; height:auto;"
                />
            </div>


            <!-- Placeholder for future art -->
            <div class="media-card">
                <h3>More Artwork Coming Soon</h3>
                <div style="
                    padding: 80px 20px;
                    text-align: center;
                    font-size: 1.2rem;
                    color: #666;
                ">
                    New drawings and designs will be added here as Wyatt
                    continues to explore and grow his creativity.
                </div>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="footer-wrap">
        <p>&copy; 2025 Wyatt Ze King. All rights reserved.</p>
    </footer>
</body>
</html>
